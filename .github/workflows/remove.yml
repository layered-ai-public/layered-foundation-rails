name: Remove from the server
run-name: Remove ${{ inputs.environment }} from its server (${{ inputs.request }})

# Layered runs this when the app is deleted, to take an environment off the
# server it deploys to.
#
# The steps are in layered-ai-public/layered-actions-github, shared by every
# Layered app, so a fix there reaches them all. This file keeps what GitHub
# needs here: the triggers, the run's name, which is how Layered finds the
# run, the concurrency group and the job. The job is here because only a job
# in this repository can read the environment's secrets, which it passes on.
# See remove/action.yml there.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment holding the server's settings
        required: true
      destination:
        description: Kamal destination (blank for the default config)
        required: false
      request:
        description: Names the run, for Layered to find it
        required: true

# Waits for a deploy of the environment under way to finish first.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  remove:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    # config/deploy.yml reads these. Layered writes them as variables of the
    # environment (Settings → Environments); one set at repository level is
    # used for any environment that doesn't set its own.
    env:
      KAMAL_DEPLOY_IP: ${{ vars.KAMAL_DEPLOY_IP }}
      KAMAL_DEPLOY_DOMAIN: ${{ vars.KAMAL_DEPLOY_DOMAIN }}
    steps:
      - uses: layered-ai-public/layered-actions-github/remove@v1
        with:
          environment: ${{ inputs.environment }}
          destination: ${{ inputs.destination }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          rails_master_key: ${{ secrets.RAILS_MASTER_KEY }}
