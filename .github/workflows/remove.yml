name: Remove from the server
run-name: Remove ${{ inputs.environment }} from its server (${{ inputs.request }})

# Layered runs this when the app is deleted, to take an environment off the
# server it deploys to.
#
# The steps are in layered-ai-public/layered-actions-github, shared by every
# Layered app, so a fix there reaches them all. This file keeps what GitHub
# needs here: the triggers, the run's name, which is how Layered finds the
# run, and the concurrency group. See remove.yml there.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment holding the server's settings
        required: true
      destination:
        description: Kamal destination (blank for the default config)
        required: false
      request:
        description: Names the run, for Layered to find it
        required: true

# Waits for a deploy of the environment under way to finish first.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  remove:
    uses: layered-ai-public/layered-actions-github/.github/workflows/remove.yml@v1
    with:
      environment: ${{ inputs.environment }}
      destination: ${{ inputs.destination }}
