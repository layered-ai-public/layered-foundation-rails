name: Claude

# Runs Claude Code when someone mentions @claude in an issue, a pull request
# comment or a review. Claude answers in the thread and pushes any changes it
# makes to a branch.
#
# It needs one of these repository secrets (Settings → Secrets and variables →
# Actions → Secrets). Layered writes whichever fits the key it's given:
#   ANTHROPIC_API_KEY        an API key from console.anthropic.com
#   CLAUDE_CODE_OAUTH_TOKEN  a Pro or Max subscription token, from `claude setup-token`
#
# Claude acts on GitHub with this workflow's GITHUB_TOKEN by default. Pushes
# and pull requests made with that token don't trigger other workflows, so CI
# won't run on Claude's work until someone pushes to it. To have Claude act as
# the Claude GitHub App instead (https://github.com/apps/claude), install the
# app on this repository and set the repository variable CLAUDE_GITHUB_APP to
# true.

# Names each run for the issue or pull request it answers, which is how Layered
# finds the run an issue it opened started.
run-name: "Claude on #${{ github.event.issue.number || github.event.pull_request.number }}"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # The Claude GitHub App's token is exchanged for this workflow's OIDC token.
      id-token: write
      # Lets Claude read CI results on pull requests.
      actions: read
    steps:
      # An unset secret arrives as an empty string, and the action's own error
      # for that doesn't say where to set one.
      - name: Check for a key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Set the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN repository secret (Settings → Secrets and variables → Actions → Secrets)."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Claude runs bin/rails, the tests and rubocop as it works.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Empty means the Claude GitHub App, through the OIDC exchange.
          github_token: ${{ vars.CLAUDE_GITHUB_APP != 'true' && secrets.GITHUB_TOKEN || '' }}
