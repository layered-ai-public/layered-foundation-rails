name: opencode

# Runs opencode when someone opens an issue that mentions /opencode, or
# mentions it on a pull request: in its description, a comment or a review
# comment. It needs the API key for the model's provider as a repository
# secret, which Layered writes: one of those below, each of which can be given
# to opencode alone as OPENCODE_<name>.
#
# The steps are in layered-ai-public/layered-actions-github, shared by every
# Layered app, so a fix there reaches them all. This file keeps what GitHub
# needs here: the triggers, the run's name, which is how Layered finds the run
# an issue it opened started, the permissions, and the secrets passed on. See
# opencode.yml there.

run-name: "opencode on #${{ github.event.issue.number || github.event.pull_request.number }}"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  # A pull request from a fork gets no secrets, so this only works for
  # branches in this repository.
  pull_request:
    types: [opened]

jobs:
  opencode:
    uses: layered-ai-public/layered-actions-github/.github/workflows/opencode.yml@v1
    permissions:
      contents: write
      pull-requests: write
      issues: write
    secrets:
      OPENCODE_ANTHROPIC_API_KEY OPENAI_API_KEY OPENROUTER_API_KEY TOGETHER_API_KEY FIREWORKS_API_KEY GROQ_API_KEY CEREBRAS_API_KEY GEMINI_API_KEY XAI_API_KEY MISTRAL_API_KEY: ${{ secrets.OPENCODE_ANTHROPIC_API_KEY OPENAI_API_KEY OPENROUTER_API_KEY TOGETHER_API_KEY FIREWORKS_API_KEY GROQ_API_KEY CEREBRAS_API_KEY GEMINI_API_KEY XAI_API_KEY MISTRAL_API_KEY }}
      ANTHROPIC_API_KEY OPENAI_API_KEY OPENROUTER_API_KEY TOGETHER_API_KEY FIREWORKS_API_KEY GROQ_API_KEY CEREBRAS_API_KEY GEMINI_API_KEY XAI_API_KEY MISTRAL_API_KEY: ${{ secrets.ANTHROPIC_API_KEY OPENAI_API_KEY OPENROUTER_API_KEY TOGETHER_API_KEY FIREWORKS_API_KEY GROQ_API_KEY CEREBRAS_API_KEY GEMINI_API_KEY XAI_API_KEY MISTRAL_API_KEY }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
