name: opencode

# Runs opencode when someone opens an issue that mentions /opencode, or
# mentions it on a pull request: in its description, a comment or a review
# comment. It needs the API key for the model's provider as a repository
# secret, which Layered writes: one of those below, each of which can be given
# to opencode alone as OPENCODE_<name>.
#
# A member of the app can give opencode keys of their own in Layered, which
# writes each as OPENCODE_<name> with their GitHub user id on the end (e.g.
# OPENCODE_ANTHROPIC_API_KEY_U12345). Runs they start use theirs for each
# provider they've given one for, and the app's for the rest. Who started the
# run comes from GitHub, never from the issue.
#
# The steps are in layered-ai-public/layered-actions-github, shared by every
# Layered app, so a fix there reaches them all. This file keeps what GitHub
# needs here: the triggers, the run's name, which is how Layered finds the run
# an issue it opened started, the permissions, and the secrets passed on. See
# opencode.yml there.

run-name: "opencode on #${{ github.event.issue.number || github.event.pull_request.number }}"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  # A pull request from a fork gets no secrets, so this only works for
  # branches in this repository.
  pull_request:
    types: [opened]

jobs:
  opencode:
    uses: layered-ai-public/layered-actions-github/.github/workflows/opencode.yml@v1
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # Proves to Layered which repository this is, so the agent can read the
      # app's other repositories beside this one.
      id-token: write
    secrets:
      OPENCODE_ANTHROPIC_API_KEY: ${{ secrets[format('OPENCODE_ANTHROPIC_API_KEY_U{0}', github.actor_id)] || secrets.OPENCODE_ANTHROPIC_API_KEY }}
      OPENCODE_OPENAI_API_KEY: ${{ secrets[format('OPENCODE_OPENAI_API_KEY_U{0}', github.actor_id)] || secrets.OPENCODE_OPENAI_API_KEY }}
      OPENCODE_OPENROUTER_API_KEY: ${{ secrets[format('OPENCODE_OPENROUTER_API_KEY_U{0}', github.actor_id)] || secrets.OPENCODE_OPENROUTER_API_KEY }}
      OPENCODE_TOGETHER_API_KEY: ${{ secrets[format('OPENCODE_TOGETHER_API_KEY_U{0}', github.actor_id)] || secrets.OPENCODE_TOGETHER_API_KEY }}
      OPENCODE_FIREWORKS_API_KEY: ${{ secrets[format('OPENCODE_FIREWORKS_API_KEY_U{0}', github.actor_id)] || secrets.OPENCODE_FIREWORKS_API_KEY }}
      OPENCODE_GROQ_API_KEY: ${{ secrets[format('OPENCODE_GROQ_API_KEY_U{0}', github.actor_id)] || secrets.OPENCODE_GROQ_API_KEY }}
      OPENCODE_CEREBRAS_API_KEY: ${{ secrets[format('OPENCODE_CEREBRAS_API_KEY_U{0}', github.actor_id)] || secrets.OPENCODE_CEREBRAS_API_KEY }}
      OPENCODE_GEMINI_API_KEY: ${{ secrets[format('OPENCODE_GEMINI_API_KEY_U{0}', github.actor_id)] || secrets.OPENCODE_GEMINI_API_KEY }}
      OPENCODE_XAI_API_KEY: ${{ secrets[format('OPENCODE_XAI_API_KEY_U{0}', github.actor_id)] || secrets.OPENCODE_XAI_API_KEY }}
      OPENCODE_MISTRAL_API_KEY: ${{ secrets[format('OPENCODE_MISTRAL_API_KEY_U{0}', github.actor_id)] || secrets.OPENCODE_MISTRAL_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
