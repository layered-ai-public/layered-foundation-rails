name: CI

# The steps are in layered-ai-public/layered-actions-github, shared by every
# Layered app, so a fix there reaches them all. This file keeps what GitHub
# needs here: the triggers. See ci.yml there.

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  ci:
    uses: layered-ai-public/layered-actions-github/.github/workflows/ci.yml@v1
