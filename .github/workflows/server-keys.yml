name: Authorize deploy keys
run-name: Authorize deploy keys on ${{ inputs.server }} (${{ inputs.request }})

# Layered runs this to let a new environment deploy to a server another
# environment already deploys to, so nobody has to log in to add its key.
#
# The steps are in layered-ai-public/layered-actions-github, shared by every
# Layered app, so a fix there reaches them all. This file keeps what GitHub
# needs here: the triggers, the run's name, which is how Layered finds the
# run, the concurrency group and the job. The job is here because only a job
# in this repository can read the environment's secrets, which it passes on.
# See server-keys/action.yml there.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment whose key is on the server
        required: true
      server:
        description: The server's IP, which must be the environment's
        required: true
      project:
        description: The Layered project the keys are for, such as p12
        required: true
      request:
        description: Names the run, for Layered to find it
        required: true
      authorized_keys:
        description: Every key of the project deploying to the server, one per line
        required: true

concurrency:
  group: server-keys-${{ inputs.server }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 5
    # config/deploy.yml reads these. Layered writes them as variables of the
    # environment (Settings → Environments); one set at repository level is
    # used for any environment that doesn't set its own.
    env:
      KAMAL_DEPLOY_IP: ${{ vars.KAMAL_DEPLOY_IP }}
      KAMAL_DEPLOY_DOMAIN: ${{ vars.KAMAL_DEPLOY_DOMAIN }}
    steps:
      - uses: layered-ai-public/layered-actions-github/server-keys@v1
        with:
          server: ${{ inputs.server }}
          project: ${{ inputs.project }}
          authorized_keys: ${{ inputs.authorized_keys }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
