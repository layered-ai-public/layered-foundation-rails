name: Set up app

# Runs the one-time setup task (rename + starter cleanup) and opens a PR with
# the result. Once that PR is merged the task is gone and this workflow just
# fails with an explanation - it's safe to leave in place or delete.
#
# The steps are in layered-ai-public/layered-actions-github, shared by every
# Layered app, so a fix there reaches them all. This file keeps what GitHub
# needs here: the triggers, the permissions and the concurrency group. See
# setup.yml there.

on:
  workflow_dispatch:
    inputs:
      name:
        description: New application name (CamelCase, e.g. MyApp)
        required: true
        type: string
      open_pull_request:
        description: Open a PR from the branch (Layered turns this off and opens the PR itself, so CI runs on it)
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: setup
  cancel-in-progress: false

jobs:
  setup:
    uses: layered-ai-public/layered-actions-github/.github/workflows/setup.yml@v1
    with:
      name: ${{ inputs.name }}
      open_pull_request: ${{ inputs.open_pull_request }}
